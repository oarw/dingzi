<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Dingzi 钉子</title>
<!-- xterm.js, vendored rather than loaded from a CDN: the panel is one binary
     with no outbound dependencies, and a monitoring tool that needs the
     internet to render is a monitoring tool that fails when you need it.
     MIT licensed, see vendor/LICENSE-xterm. -->
<link rel="stylesheet" href="vendor/xterm.css">
</head>
<body>
<!--
THESIS: A fleet panel read the way a departure board is read — from across the
room, before you decide to care. Refuses the category's rounded-card dashboard
with a donut chart and a gradient accent.
OWN-WORLD: Near-black board ground, amber readouts in recessed wells. Segmented
LED bars whose lit count carries the value, so magnitude survives without
colour. A board marks an exception loudly: a machine in trouble takes a filled
status band across its header, the way a cancelled service does. Light theme is
the printed timetable — black ink on paper, colour reserved for exceptions.
STORY: The operator sees which headers are banded and knows the fleet's state
without reading a number.
FIRST VIEWPORT: Board header with live clock and fleet tally; beneath it a grid
of machine blocks, four saturation metrics loud, static facts quiet.
FORM: Transit departure board, candidate 6 of 7, seed f4ae58b6. Chosen by the
author over the rack panel and the bar signature.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<style>
/* ---- tokens -------------------------------------------------------------
   Dark is the board itself. Light is not a washed-out board: it is the printed
   timetable, where normal entries are black ink and only exceptions take
   colour. That inversion is what fixes the light theme's contrast — the old
   amber-on-paper readouts sat at 4.18:1, under the 4.5:1 floor. */
:root{
  --ground:#08090b; --board:#13161b; --board-lo:#0e1116; --well:#080a0d;
  --edge:rgba(255,255,255,.07);
  --ink:#e9e7e2; --ink-dim:#8a8780;
  --val:#ffb000;              /* normal readout */
  --caution:#ffd400; --warn:#ff4133; --ok:#3ad17c;
  --band:#ff4133;             /* header band on an in-trouble machine */
  /* Ink on the band is the board's own ground, not white: white on this red is
     3.47:1, and darkening the band to fix that would cost it the loudness that
     makes it the anchor. Dark-on-bright is what warning signage does anyway, and
     it reads as punched out of the board. #08090b on #ff4133 = 5.66:1. */
  --band-ink:#08090b;
  /* The 告警 tag is a light chip standing off the red band, carrying ink deeper
     than the band itself: --band on white is only 3.47:1, and this tag is what
     keeps state off colour alone. #c62519 on #f7f5f2 = 4.9:1. */
  --flag-bg:#f7f5f2; --flag-ink:#c62519;
  --lamp-glow:1;              /* LEDs emit on the dark board */
  --hatch:rgba(255,255,255,.045);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --r:3px;
}
/* Light: printed timetable. Measured against --well #e2e2df —
   ink #1a1d21 15.2:1 · caution #7a4a00 6.0:1 · warn #a8140c 6.1:1 · dim #585c61 5.2:1.
   All clear 4.5:1. Normal readouts are ink, not amber, so the colour that does
   appear means something. */
@media (prefers-color-scheme:light){
  :root[data-theme=auto]{
    --ground:#ececeb; --board:#f7f7f6; --board-lo:#f0f0ee; --well:#e2e2df;
    --edge:rgba(0,0,0,.12);
    --ink:#15171a; --ink-dim:#585c61;
    --val:#1a1d21; --caution:#7a4a00; --warn:#a8140c; --ok:#1d7a45;
    --band:#a8140c; --band-ink:#fff; --flag-bg:#fff; --flag-ink:#8f1109;
    --lamp-glow:0;            /* printed status dots do not emit light */
    --hatch:rgba(0,0,0,.055);
  }
}
:root[data-theme=light]{
  --ground:#ececeb; --board:#f7f7f6; --board-lo:#f0f0ee; --well:#e2e2df;
  --edge:rgba(0,0,0,.12);
  --ink:#15171a; --ink-dim:#585c61;
  --val:#1a1d21; --caution:#7a4a00; --warn:#a8140c; --ok:#1d7a45;
  --band:#a8140c; --band-ink:#fff; --flag-bg:#fff; --flag-ink:#8f1109;
  --lamp-glow:0;
  --hatch:rgba(0,0,0,.055);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.4;
  padding:22px 20px 56px; min-height:100vh;
  font-variant-numeric:tabular-nums;
}
/* Browser surfaces belong to the design too — these ship as browser defaults
   otherwise, which is the cheapest tell that a page was assembled. */
::selection{background:var(--val);color:var(--ground)}
:root{caret-color:var(--val);scrollbar-color:var(--edge) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--edge);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-dim)}
:focus-visible{outline:2px solid var(--val);outline-offset:2px}

/* ---- board header ------------------------------------------------------- */
.board{max-width:1560px;margin:0 auto}
.masthead{
  display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;
  padding:0 2px 14px;border-bottom:1px solid var(--edge);margin-bottom:18px;
}
.wordmark{
  font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.30em;
  text-transform:uppercase;color:var(--val);
}
.wordmark small{
  display:block;font-size:9px;letter-spacing:.34em;color:var(--ink-dim);
  margin-top:5px;font-weight:400;
}
.tally{display:flex;gap:20px;margin-left:auto;align-items:center;flex-wrap:wrap}
.tally b{font-family:var(--mono);font-size:17px;font-weight:600}
.tally i{
  font-style:normal;font-size:9px;letter-spacing:.20em;text-transform:uppercase;
  color:var(--ink-dim);margin-left:6px;
}
.t-on b{color:var(--ok)} .t-warn b{color:var(--warn)} .t-off b{color:var(--ink-dim)}
/* Now-marker: a board nobody can date lies when the feed dies. */
.clock{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-dim);
  display:flex;align-items:center;gap:8px;
}
.clock .beat{
  width:6px;height:6px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 calc(8px * var(--lamp-glow)) var(--ok);
  animation:beat 2s steps(1,end) infinite;
}
@keyframes beat{0%,49%{opacity:1}50%,100%{opacity:.18}}
.themer{display:flex;border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.themer button{
  font:inherit;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 9px;background:transparent;color:var(--ink-dim);border:0;cursor:pointer;
}
.themer button[aria-pressed=true]{background:var(--val);color:var(--ground);font-weight:700}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
@media (max-width:940px){.grid{grid-template-columns:1fr}}

/* ---- machine block ------------------------------------------------------ */
.mc{
  background:linear-gradient(180deg,var(--board) 0%,var(--board-lo) 100%);
  border:1px solid var(--edge);border-radius:var(--r);
  padding:0 0 11px;position:relative;overflow:hidden;
}
.mc.is-off{background:var(--board-lo)}
/* Offline hatch — state as pattern, never colour alone. */
.mc.is-off::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,transparent 0 7px,var(--hatch) 7px 14px);
}
/* THE ANCHOR. A 9px lamp against ten equal wells gave the eye nothing to catch,
   so a machine in trouble takes a filled band across its whole header — what a
   board does to a cancelled service. This is the card-level signal that makes
   the fleet readable without reading a number. */
.mc-head{
  display:flex;align-items:center;gap:10px;
  padding:11px 14px 10px;border-bottom:1px solid var(--edge);
  background:rgba(0,0,0,.16);
}
:root[data-theme=light] .mc-head,
:root[data-theme=auto] .mc-head{background:rgba(0,0,0,.035)}
@media (prefers-color-scheme:dark){:root[data-theme=auto] .mc-head{background:rgba(0,0,0,.16)}}
.mc.is-warn .mc-head{background:var(--band);border-bottom-color:var(--band)}
.mc.is-warn .mc-name,.mc.is-warn .mc-spec{color:var(--band-ink)}
/* No opacity on the spec here: fading ink against the band is what pushed it
   under the contrast floor. It is already quiet by size. */
.lamp{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok);
  box-shadow:0 0 calc(9px * var(--lamp-glow)) var(--ok)}
.lamp.off{background:var(--well);box-shadow:inset 0 0 0 1px var(--edge)}
/* On a banded header the lamp reads as a hole punched in the band. A glowing
   green dot inside a red band would be two conflicting signals. */
.mc.is-warn .lamp{background:var(--band-ink);box-shadow:none}
.mc-name{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.05em}
/* Text marker beside the lamp: colourblind- and distance-safe. */
.mc-flag{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;font-weight:700;
}
.mc.is-warn .mc-flag{background:var(--flag-bg);color:var(--flag-ink)}
.mc-flag.off{background:var(--well);color:var(--ink-dim);box-shadow:inset 0 0 0 1px var(--edge)}
.mc-spec{
  margin-left:auto;text-align:right;font-family:var(--mono);font-size:10px;
  color:var(--ink-dim);line-height:1.5;
}

/* ---- tier 1: the four saturation metrics, loud ---------------------------
   PRODUCT.md principle 3: unequal information, unequal weight. These four say
   whether the machine is in trouble, so they get the size and the bars. */
.sat{padding:12px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.mod{min-width:0}
.mod-k{
  font-family:var(--mono);font-size:9px;letter-spacing:.20em;text-transform:uppercase;
  color:var(--ink-dim);margin-bottom:4px;
}
/* Recessed well. No fold seam: at this size a 1px line across the middle of a
   numeral reads as a strikethrough, not a hinge. */
.well{
  background:var(--well);border-radius:2px;box-shadow:inset 0 0 0 1px var(--edge);
  padding:5px 8px;display:flex;align-items:baseline;gap:7px;
  transform-origin:50% 50%;backface-visibility:hidden;
}
.well.flipping{animation:flip .19s ease-out}
@keyframes flip{
  0%{transform:perspective(220px) rotateX(-84deg);filter:brightness(1.5)}
  100%{transform:perspective(220px) rotateX(0);filter:brightness(1)}
}
@media (prefers-reduced-motion:reduce){
  .well.flipping{animation:none}
  .clock .beat{animation:none}
}
.num{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--val)}
.num.caution{color:var(--caution)} .num.warn{color:var(--warn)}
.num.dead,.num.zero{color:var(--ink-dim)}
.sub{font-family:var(--mono);font-size:10px;color:var(--ink-dim);margin-left:auto;
  white-space:nowrap}
.num.caution+.sub{color:var(--caution)} .num.warn+.sub{color:var(--warn)}

/* Segmented bar: lit-segment COUNT carries the value, so magnitude reads
   without relying on hue. */
.segs{display:flex;gap:2px;margin-top:5px;height:7px}
.seg{flex:1;background:var(--edge);border-radius:1px}
.seg.on{background:var(--val)}
.seg.on.caution{background:var(--caution)}
.seg.on.warn{background:var(--warn)}
.mc.is-off .seg{background:var(--edge)}

/* ---- tier 2: reference facts, quiet ------------------------------------- */
.facts{padding:11px 14px 0;margin-top:10px;border-top:1px solid var(--edge);
  display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.fx{display:flex;align-items:baseline;gap:8px;min-width:0}
.fk{font-family:var(--mono);font-size:9px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--ink-dim);flex:none}
.fv{font-family:var(--mono);font-size:13px;color:var(--ink)}
.fv.k{color:var(--ink-dim)}
.fv i{font-style:normal;color:var(--ink-dim)}
.fv em{font-style:normal;color:var(--ink-dim);padding:0 1px}
.w2{grid-column:1/-1}
/* Quota: the bar is scaled to the cap, so the tick marks the 80% caution line
   rather than restating the bar's own end. */
.quota{position:relative;margin-top:5px}
.limit{position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:var(--ink);
  opacity:.5}
.legend{
  max-width:1560px;margin:26px auto 0;padding-top:14px;border-top:1px solid var(--edge);
  font-family:var(--mono);font-size:10px;letter-spacing:.10em;color:var(--ink-dim);
  display:flex;gap:9px 22px;flex-wrap:wrap;
}
.legend b{color:var(--ink);font-weight:600}

/* ---- phone --------------------------------------------------------------
   Last, so these win the cascade over the rules they override.
   The saturation metrics STAY two-up: collapsing all ten fields to one column
   cost 612px per machine, which is a ~30,000px scroll at the 50-machine ceiling
   PRODUCT.md names, on the viewport it calls first-class. */
@media (max-width:560px){
  body{padding:16px 12px 44px}
  .masthead{gap:11px;padding-bottom:12px}
  .tally{margin-left:0;width:100%;gap:13px}
  .tally b{font-size:15px}
  .wordmark{font-size:16px}
  .wordmark small{font-size:8px}
  .mc-head{padding:10px 12px 9px}
  .mc-name{font-size:15px}
  .mc-spec{font-size:9px}
  .sat{padding:11px 12px 0;gap:8px 10px}
  .num{font-size:16px}
  .facts{padding:10px 12px 0;grid-template-columns:1fr;gap:5px}
  .legend{gap:7px 16px}
}
/* ── terminal ─────────────────────────────────────────────────────────────
   A service panel opening on the board, not a separate application. The
   terminal's own colours are already amber-on-near-black, so it needs no
   reconciling with the board — it needs a frame that reads as part of it. */
.mc-term{
  margin-left:auto;align-self:start;
  font:600 11px/1 var(--mono);letter-spacing:.06em;
  color:var(--val);background:var(--well);
  border:1px solid var(--edge);border-radius:var(--r);
  padding:4px 7px;cursor:pointer;
}
.mc-term:hover{border-color:var(--val)}
.mc-term:focus-visible{outline:2px solid var(--val);outline-offset:2px}
/* On a card whose header is a solid warning band, the button sits on that band
   and must take its ink from it or it disappears into the colour. */
.mc.is-warn .mc-term{color:var(--band-ink);border-color:rgba(0,0,0,.35);
  background:rgba(0,0,0,.12)}

.term-wrap{
  position:fixed;inset:0;z-index:50;display:none;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(3px);
  padding:min(4vh,32px) min(4vw,32px);
}
.term-wrap[data-open="1"]{display:flex}
.term-box{
  margin:auto;width:100%;max-width:1100px;height:100%;max-height:760px;
  display:flex;flex-direction:column;
  background:var(--board);border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:0 24px 64px rgba(0,0,0,.45);overflow:hidden;
}
.term-head{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;background:var(--board-lo);
  border-bottom:1px solid var(--edge);
}
.term-title{font:600 13px/1.2 var(--sans);color:var(--ink)}
.term-shell{font:400 11px/1.2 var(--mono);color:var(--ink-dim)}
/* The exposure is stated in the frame, every session. An operator who opened a
   root shell on a container should not have to remember that they did. */
.term-warn{
  font:600 10px/1 var(--mono);letter-spacing:.04em;
  color:var(--flag-ink);background:var(--flag-bg);
  padding:3px 6px;border-radius:2px;
}
.term-x{
  margin-left:auto;font:600 15px/1 var(--mono);
  color:var(--ink-dim);background:none;border:0;cursor:pointer;padding:4px 8px;
}
.term-x:hover{color:var(--warn)}
.term-x:focus-visible{outline:2px solid var(--val);outline-offset:2px}
.term-body{flex:1;min-height:0;background:var(--well);padding:8px 10px}
.term-body .xterm{height:100%}
@media (max-width:560px){
  .term-wrap{padding:0}
  .term-box{max-height:none;border-radius:0;border:0}
  .term-shell{display:none}
}
</style>
<link rel="stylesheet" href="app.css">
<div class="board">

      <span class="t-warn"><b id="n-warn">—</b><i>指标异常</i></span>
      <span class="t-off"><b id="n-off">—</b><i>离线</i></span>

      <div class="themer" role="group" aria-label="主题">

      </div>
    </div>
  </header>
  <nav class="navigation" aria-label="主导航">
    <a href="#fleet" data-view="fleet" aria-current="page">机器</a>
    <a href="#monitors" data-view="monitors">服务监控</a>

  </nav>

  <main>

</div>
<dialog class="term-wrap" id="term-wrap"
     aria-labelledby="term-title">

    <div class="term-head">
      <span class="term-title" id="term-title">终端</span>

      <span class="term-warn">以 agent 的用户身份运行</span>
      <button class="term-x icon-button" id="term-x" aria-label="关闭终端" title="关闭终端"><span class="icon" style="--icon:url(vendor/icons/x.svg)"></span></button>
    </div>
    <div class="term-body" id="term-body"></div>
  </div>
</dialog>

<script>
"use strict";
const T={caution:70,warn:90};
const band=v=>v>=T.warn?"warn":v>=T.caution?"caution":"";
const qband=v=>v>=95?"warn":v>=80?"caution":"";
// esc guards every agent-supplied string on its way into HTML. The machine name
// comes from a hostname or an operator's input, and the platform strings come
// from the agent, so none of them are the panel's to trust.
function esc(s){return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function human(b){const u=["B","K","M","G","T","P"];let i=0;
  while(b>=1024&&i<u.length-1){b/=1024;i++}
  return (b<10&&i>0?b.toFixed(1):Math.round(b))+u[i]}
function dur(s){if(!s)return "—";const d=Math.floor(s/86400);
  if(d>0)return d+"天";const h=Math.floor(s/3600);
  if(h>0)return h+"小时";return Math.max(1,Math.floor(s/60))+"分钟"}
function segs(v,cls){let h='<div class="segs" aria-hidden="true">';
  const on=Math.round(v/5);
  for(let i=0;i<20;i++)h+='<div class="seg'+(i<on?" on "+cls:"")+'"></div>';
  return h+"</div>"}
// Tier 1: loud. Lit-segment count carries magnitude; the text marker carries
// caution and warn without relying on hue.
function sat(k,v,off){
  if(off)return '<div class="mod"><div class="mod-k">'+k+'</div><div class="well">'+
    '<span class="num dead">——</span></div>'+segs(0,"")+'</div>';
  v=Math.round(v*10)/10;
  const c=band(v), tone=v===0?"zero":c;
  return '<div class="mod"><div class="mod-k">'+k+'</div><div class="well">'+
    '<span class="num '+tone+'">'+v+'%</span>'+
    (c?'<span class="sub">'+(c==="warn"?"告警":"注意")+'</span>':'')+
    '</div>'+segs(v,c)+'</div>'}
function billedTraffic(inBytes,outBytes,mode){
  return mode==='out'?outBytes:mode==='max'?Math.max(inBytes,outBytes):inBytes+outBytes;
}
function quota(m){
  const io='<span class="fv"><i>↓</i>'+human(m.net_in_total)+
    ' <i>↑</i>'+human(m.net_out_total)+'</span>';
  if(!m.quota_bytes)return '<div class="fx w2"><span class="fk">流量</span>'+io+
    '<span class="fv k">未设配额</span></div>';
  const mode=m.quota_mode||"sum";
  const used=billedTraffic(m.net_in_total,m.net_out_total,mode);
  const p=Math.min(100,Math.round(used/m.quota_bytes*100)), c=qband(p);
  return '<div class="fx w2"><span class="fk">流量</span>'+io+
    '<span class="fv'+(c?" ":" k")+'">'+p+'% / '+human(m.quota_bytes)+
    ' ('+mode+')</span></div>'+
    '<div class="w2 quota">'+segs(p,c)+'<span class="limit"></span></div>'}
function card(m){
  const off=!m.online;
  const hot=!off&&[m.cpu,m.mem,m.swap,m.disk].some(v=>v>=T.warn);
  return '<article class="mc'+(off?" is-off":"")+(hot?" is-warn":"")+'">'+
    '<div class="mc-head">'+
      '<span class="lamp'+(off?" off":"")+'" aria-hidden="true"></span>'+
      '<a class="mc-name" href="#machine/'+m.id+'">'+esc(m.name)+'</a>'+
      (off?'<span class="mc-flag off">离线</span>':
       hot?'<span class="mc-flag">告警</span>':'')+
      '<span class="mc-spec">'+esc(m.platform)+' '+esc(m.platform_version)+'<br>'+
        esc(m.arch)+' · '+m.cores+'核'+m.threads+'线</span>'+
      // Shown only where a terminal can actually open: the panel allows it, the
      // agent allows it, and the machine is online.
      ((AUTHED&&PANEL_TERMINAL&&m.terminal&&!off)
        ?'<button class="mc-term" data-id="'+m.id+'" data-name="'+esc(m.name)+
         '" title="打开终端" aria-label="打开 '+esc(m.name)+' 的终端">'+icon('terminal')+'</button>':'')+
    '</div>'+
    '<div class="sat">'+sat("CPU",m.cpu,off)+sat("内存",m.mem,off)+
      sat("交换",m.swap,off)+sat("硬盘",m.disk,off)+'</div>'+
    '<div class="facts">'+
      '<div class="fx"><span class="fk">负载</span><span class="fv'+(off?" k":"")+'">'+
        (off?"——":m.load.map(x=>x.toFixed(2)).join('<em>/</em>'))+'</span></div>'+
      '<div class="fx"><span class="fk">在线</span><span class="fv'+(off?" k":"")+'">'+
        (off?"离线 "+dur(m.offline_for):dur(m.uptime))+'</span></div>'+
      '<div class="fx w2"><span class="fk">网速</span><span class="fv'+(off?" k":"")+'">'+
        (off?"——":'<i>↓</i>'+human(m.net_in_speed)+'/s <i>↑</i>'+
          human(m.net_out_speed)+'/s')+'</span></div>'+
      (off?'<div class="fx w2"><span class="fk">流量</span>'+
        '<span class="fv k">——</span></div>':quota(m))+
    '</div><div class="machine-actions"><a class="text-link" href="#machine/'+m.id+'">'+icon('chart-no-axes-combined')+'历史</a>'+
      (AUTHED?tool('settings','设置 '+m.name,'machine-edit',m.id):'')+'</div></article>'}

const grid=document.getElementById("grid");
function render(list){
  const focused=document.activeElement;
  const key=grid.contains(focused)?{href:focused.getAttribute('href'),id:focused.dataset.id,action:focused.dataset.action}:null;
  const markup=list.map(card).join("");
  if(grid.innerHTML!==markup){
    grid.innerHTML=markup;
    if(key){const match=[...grid.querySelectorAll('a,button')].find(el=>key.href?el.getAttribute('href')===key.href:el.dataset.id===key.id&&el.dataset.action===key.action);if(match)match.focus({preventScroll:true})}
  }
  const on=list.filter(m=>m.online).length;
  const hot=list.filter(m=>m.online&&
    [m.cpu,m.mem,m.swap,m.disk].some(v=>v>=T.warn)).length;
  document.getElementById("n-on").textContent=on;
  document.getElementById("n-warn").textContent=hot;
  document.getElementById("n-off").textContent=list.length-on;
}
// PANEL_TERMINAL is whether the panel itself allows terminals. A machine also
// has to have an agent started with --allow-terminal; both must agree before the
// button appears, so an operator is never offered a control that always fails.
let PANEL_TERMINAL=false,AUTHED=false,FLEET=[],loadingFleet=false;

// Keep the renderer independent of API field names.
function adapt(row,now){
  return {id:row.id,name:row.name,online:row.online,
    platform:row.platform,platform_version:"",arch:row.arch,
    cores:row.cpu_cores,threads:row.cpu_threads,
    cpu:row.cpu,mem:row.mem,swap:row.swap,disk:row.disk,
    load:[row.load1,row.load5,row.load15],
    uptime:row.uptime,
    offline_for:row.last_seen?Math.max(0,now-row.last_seen):0,
    net_in_speed:row.net_in_speed,net_out_speed:row.net_out_speed,
    net_in_total:row.traffic_in,net_out_total:row.traffic_out,
    quota_bytes:row.quota,quota_mode:row.quota_mode,
    terminal:row.terminal_enabled,skew_ms:row.skew_ms||0};
}
async function load(){
  if(loadingFleet)return;
  loadingFleet=true;
  try{
    const r=await fetch("/api/v1/servers",{headers:{"Accept":"application/json"},signal:AbortSignal.timeout(10000)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    PANEL_TERMINAL=!!d.terminal_enabled;
    FLEET=d.servers||[];
    render((d.servers||[]).map(row=>adapt(row,d.now)));
    // An empty but reachable fleet is a real state, and it is not the same as a
    // backend that is down. Saying so beats an unexplained empty page.
    document.getElementById('fleet-empty').hidden=FLEET.length>0;
    document.getElementById('connection-status').hidden=true;
    grid.classList.remove('stale');
    document.getElementById("src").textContent='最近更新 '+new Date(d.now*1000).toLocaleTimeString('zh-CN');
  }catch{
    PANEL_TERMINAL=false;
    const status=document.getElementById('connection-status');
    status.hidden=false;status.textContent='面板连接中断，正在重试'+(FLEET.length?'；以下为最后一次收到的数据':'');
    grid.classList.add('stale');
  }finally{loadingFleet=false}
}

const Q=new URLSearchParams(location.search);
const STILL=Q.has("still");
function tick(){const d=new Date();document.getElementById("clk").textContent=
  [d.getHours(),d.getMinutes(),d.getSeconds()]
    .map(x=>String(x).padStart(2,"0")).join(":")}
if(STILL){document.getElementById("clk").textContent="14:32:07"}
else{tick();setInterval(tick,1000);
  // Poll. Without this the board shows whatever was true when the tab opened,
  // which for a monitoring panel is worse than showing nothing.
  setInterval(()=>{if(!document.hidden)load()},2000);}

/* ── terminal ─────────────────────────────────────────────────────────────── */
const TW=document.getElementById("term-wrap");
let TERM=null,FIT=null,WS=null,LASTFOCUS=null;

// Themes for xterm. Reusing the board's own tokens rather than xterm's defaults,
// so the terminal is the same object as the panel around it.
function termTheme(){
  const cs=getComputedStyle(document.documentElement);
  const v=n=>cs.getPropertyValue(n).trim();
  const light=document.documentElement.dataset.theme==="light"||
    (document.documentElement.dataset.theme==="auto"&&
     !window.matchMedia("(prefers-color-scheme: dark)").matches);
  return light
    ? {background:v("--well")||"#e2e2df",foreground:"#15171a",cursor:"#15171a",
       selectionBackground:"rgba(0,0,0,.18)"}
    : {background:v("--well")||"#080a0d",foreground:"#e9e7e2",cursor:v("--val"),
       selectionBackground:"rgba(255,176,0,.28)"};
}

function closeTerm(){
  TW.dataset.open="";
  TW.close();
  if(WS){WS.onclose=null;WS.close();WS=null}
  if(TERM){TERM.dispose();TERM=null;FIT=null}
  document.getElementById("term-shell").textContent="";
  if(LASTFOCUS&&document.body.contains(LASTFOCUS)){LASTFOCUS.focus()}
}

function openTerm(id,name){
  if(!AUTHED){showLogin();return}
  if(TERM)closeTerm();
  LASTFOCUS=document.activeElement;
  document.getElementById("term-title").textContent="终端 · "+name;
  document.getElementById("term-shell").textContent="";
  TW.dataset.open="1";
  TW.showModal();

  TERM=new Terminal({
    fontFamily:getComputedStyle(document.documentElement)
      .getPropertyValue("--mono").trim()||"monospace",
    fontSize:13,lineHeight:1.2,cursorBlink:true,
    scrollback:2000,theme:termTheme(),
    // Terminal output is bytes, not text. Letting xterm decode UTF-8 itself from
    // the raw stream is what makes a Chinese filename arrive intact even when it
    // is split across two frames.
    convertEol:false});
  FIT=new FitAddon.FitAddon();
  TERM.loadAddon(FIT);
  TERM.open(document.getElementById("term-body"));
  FIT.fit();
  TERM.focus();

  const proto=location.protocol==="https:"?"wss:":"ws:";
  const url=proto+"//"+location.host+"/api/v1/servers/"+id+
    "/terminal?cols="+TERM.cols+"&rows="+TERM.rows;
  WS=new WebSocket(url);
  WS.binaryType="arraybuffer";

  WS.onmessage=ev=>{
    if(typeof ev.data==="string"){
      // Text frames are control messages. Notices are printed into the pane so a
      // refusal reads as words instead of an empty terminal.
      let c;try{c=JSON.parse(ev.data)}catch{return}
      if(c.type==="notice"){TERM.writeln("\x1b[33m"+c.message+"\x1b[0m")}
      else if(c.type==="ready"){
        document.getElementById("term-shell").textContent=c.shell||"";
      }
      return;
    }
    TERM.write(new Uint8Array(ev.data));
  };
  WS.onerror=()=>{TERM.writeln("\x1b[31m连接失败\x1b[0m")};
  WS.onclose=()=>{TERM.writeln("\r\n\x1b[90m[连接已关闭]\x1b[0m")};

  // Keystrokes go out as binary so the bytes the shell receives are exactly the
  // bytes the terminal produced.
  const enc=new TextEncoder();
  TERM.onData(d=>{if(WS&&WS.readyState===1)WS.send(enc.encode(d))});

  // Resizing has to reach the pty, or top and vi draw into the wrong box.
  TERM.onResize(({cols,rows})=>{
    if(WS&&WS.readyState===1){
      WS.send(JSON.stringify({type:"resize",cols,rows}));
    }
  });
}

let fitTimer=null;
window.addEventListener("resize",()=>{
  if(!FIT)return;
  clearTimeout(fitTimer);
  fitTimer=setTimeout(()=>{try{FIT.fit()}catch{}},80);
});

document.getElementById("term-x").addEventListener("click",closeTerm);
TW.addEventListener('cancel',e=>{e.preventDefault();closeTerm()});
document.addEventListener("keydown",e=>{
  // Escape closes only when the terminal is open, and only when it is not the
  // shell that wants the key: xterm consumes Escape for the application, so this
  // listener sees it on the document only when the pane has no focus.
  if(e.key==="Escape"&&TW.dataset.open==="1"&&
     !document.getElementById("term-body").contains(document.activeElement)){
    closeTerm();
  }
});
// Delegated, because cards are re-rendered on every poll and a listener bound to
// a button would be discarded two seconds later.
grid.addEventListener("click",e=>{
  const b=e.target.closest(".mc-term");
  if(!b)return;
  openTerm(b.dataset.id,b.dataset.name);
});

const html=document.documentElement;
const btns=[...document.querySelectorAll(".themer button")];
function setT(t,persist){html.dataset.theme=t;
  if(persist!==false)try{localStorage.setItem("dingzi-theme",t)}catch{}
  btns.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===t)))}
btns.forEach(b=>b.onclick=()=>setT(b.dataset.t));
const forced=Q.get("theme");
let stored=null;try{stored=localStorage.getItem("dingzi-theme")}catch{}
setT(forced||stored||"auto",!forced);
</script>
