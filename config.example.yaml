# dingzi-server 配置示例
#
# 面板首次启动时会在 --data 目录下自动生成这个文件，里面填好随机密钥和密码哈希。
# 通常你不需要手写它 —— 本文件是给「想预置配置」或「要在多台面板间迁移」的场景。
#
# 位置：<--data 目录>/config.yaml，权限 0600。

# Agent 首次注册时出示的共享密钥。首次启动随机生成（32 字节）。
#
# 绑定后改用单机 token，轮换此密钥不影响已绑定 Agent；新机器需要使用更新后的密钥。
# 配置损坏时面板会拒绝启动，避免无意间替换注册密钥或管理员凭据。
agent_secret: 首次启动时自动生成

# 管理员密码的 bcrypt 哈希。首次启动时随机生成一个 12 位密码，
# 明文只在启动横幅里打印一次，之后只存哈希。
#
# 没有默认密码，也没有「弱密码检查」—— 密码是生成的，不是选的。
#
# 要改密码：停面板，备份配置，清空此项的值；下次启动会重新生成并打印密码，
# 保留 agent_secret 和数据库中的单机凭证。非空但无效的哈希会阻止启动。
password_hash: $2a$10$......

# 以下项目由命令行参数控制，不在本文件里：
#
#   --listen           监听地址，默认 :8008
#   --data             数据目录，默认 ./data
#   --interval         向 agent 下发的采样间隔（秒），0.5–30，默认 1
#   --retention-days   指标、监控结果和事件保留天数，1–365，默认 30
#   --secure-cookie    给会话 cookie 打 Secure 标记（面板走 https 时开启）
#   --terminal         是否允许网页终端，默认 true
#                      注意：agent 那边还要单独加 --allow-terminal 才能用，
#                      这里设成 false 是「整个机队谁都不许开」的总闸
