name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Go is pinned rather than floating on stable: go.mod declares 1.25.0, and an
# unpinned toolchain would download a different one on every run, so a failure
# would never be reproducible.
env:
  GO_VERSION: "1.25.0"

jobs:
  test:
    # Both platforms, because the collectors read platform-specific APIs and
    # have already disagreed once. The pty only exists on unix, so the terminal
    # integration test only runs here on ubuntu — which is the deployment
    # target, so that is where it matters.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The terminal tests start real shells, so they need more than the default
      # 10 minutes of headroom on a loaded runner.
      - name: Test
        run: go test -timeout 10m ./...

      - name: Test with race detector
        run: go test -race -timeout 10m ./...

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

  cross:
    # Every release target compiled on every push, with CGO off. The "no C
    # toolchain needed" claim is the reason for the pure-Go SQLite driver, and a
    # claim nothing checks is a claim that quietly stops being true.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm}
          - {goos: linux, goarch: 386}
          - {goos: linux, goarch: riscv64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: freebsd, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build ./cmd/server
          go build ./cmd/agent
